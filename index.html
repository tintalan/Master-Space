<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a planning desk. Summary instruments on top (EC progress, interest coverage, quarter load), then a status board of courses and a deadline list below. */
:root {
  color-scheme: light;
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --surface-2: #E3EBE5;
  --fg: #111A15;
  --muted: #55645A;
  --line: #D0DAD3;
  --accent: #1F5E3A;
  --accent-fg: #FFFFFF;
  --accent-soft: #D9EBDF;
  --good: #1B7F4B;
  --warn: #9A6200;
  --bad: #B3261E;
  --d-ai: #7A4FD6;
  --d-maths: #0E8F8B;
  --d-robotics: #C2410C;
  --d-propulsion: #C0306A;
  --d-finance: #2B6CB0;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1511; --surface: #151F19; --surface-2: #1D2A22; --fg: #E6EDE8; --muted: #96A59B;
    --line: #2A3A30; --accent: #5FBF8A; --accent-fg: #0D1511; --accent-soft: #1B3A2A;
    --good: #4CC38A; --warn: #E0A53A; --bad: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1511; --surface: #151F19; --surface-2: #1D2A22; --fg: #E6EDE8; --muted: #96A59B;
  --line: #2A3A30; --accent: #5FBF8A; --accent-fg: #0D1511; --accent-soft: #1B3A2A;
  --good: #4CC38A; --warn: #E0A53A; --bad: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 44px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; }
h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.notice { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; background: var(--surface); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.big { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.bar { height: 10px; background: var(--surface-2); border-radius: 3px; display: flex; overflow: hidden; }
.seg-commit { background: var(--accent); }
.seg-consider { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 60%, transparent) 0 3px, transparent 3px 6px); }
.muted { color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.settings { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.settings input { width: 58px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); }

.cov-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; }
.cov-label { display: flex; align-items: center; gap: 7px; font-weight: 500; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.AI { background: var(--d-ai); } .dot.Maths { background: var(--d-maths); } .dot.Robotics { background: var(--d-robotics); }
.dot.Propulsion { background: var(--d-propulsion); } .dot.Finance { background: var(--d-finance); }
.cov-bar { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cov-nums { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }

.load { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 120px; }
.load-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; gap: 3px; min-width: 0; }
.load-stack { display: flex; flex-direction: column-reverse; }
.load-stack > div { width: 100%; }
.load-val { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.load-lab { text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip.static { cursor: default; padding: 1px 8px; }

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; align-items: start; }
.col { background: var(--surface-2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px; }
.col-head .mono { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card-code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.card-name { font-weight: 600; overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.card-foot { display: flex; justify-content: space-between; gap: 6px; }
.card-note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tag-core { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--surface); }
.col-empty { font-size: 12px; color: var(--muted); padding: 6px 4px; }

.dl-form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
@media (max-width: 640px) { .dl-form { grid-template-columns: 1fr; } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.in { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; color: var(--fg); min-width: 0; width: 100%; }
.dl-group { display: flex; flex-direction: column; gap: 6px; }
.dl { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.dl.done .dl-title { text-decoration: line-through; color: var(--muted); }
.dl-title { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.dl-due { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.dl-due.over { color: var(--bad); } .dl-due.soon { color: var(--warn); }
.dl input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.dl-course { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .dl { grid-template-columns: auto 1fr auto; } .dl-due { grid-column: 2; text-align: left; } }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, #000 50%, transparent); display: grid; place-items: center; z-index: 20;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { font-size: 26px; text-transform: uppercase; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sheet-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .card, .btn, .chip { transition: border-color .12s; } }
.filters { row-gap: 10px; }
.fgroup { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.filter-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.card-foot { align-items: center; }
.card-lec { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.cp { display: flex; flex-direction: column; gap: 18px; }
.crumb { align-self: flex-start; }
.cp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.cp-titles { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 320px; }
.cp-titles .eyebrow { margin: 0; }
.cp-name { font-size: 40px; line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase; color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
.cp-notes { color: var(--muted); max-width: 70ch; overflow-wrap: anywhere; white-space: pre-wrap; }
.lec-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lec-layout { display: grid; grid-template-columns: minmax(200px, 280px) minmax(0, 1fr); gap: 16px; align-items: start; }
.lec-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lec-item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lec-item:hover { border-color: var(--accent); }
.lec-item[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lec-n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.lec-t { font-weight: 600; overflow-wrap: anywhere; }
.lec-editor { display: flex; flex-direction: column; gap: 14px; }
.lec-meta { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; }
.notes-area { min-height: 46vh; line-height: 1.6; font-size: 15px; resize: vertical; }
.lec-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
@media (max-width: 760px) {
  .lec-layout { grid-template-columns: 1fr; }
  .lec-list { max-height: 220px; overflow: auto; }
  .lec-meta { grid-template-columns: 1fr; }
  .cp-name { font-size: 30px; }
}
[hidden] { display: none !important; }
body { margin: 0; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <p class="eyebrow">MSc Aerospace Engineering · Space Engineering profile · TU Delft</p>
      <h1>Master Planner</h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="backup" id="backup">Back up</button><button class="btn" data-act="restore" id="restore">Restore</button><input type="file" id="restore-file" accept="application/json,.json" hidden><button class="btn primary" data-act="add-course" id="add-course">Add course</button></div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div>
  <section class="summary" id="summary" aria-label="Summary"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-courses" data-act="tab" data-v="courses" aria-selected="true">Courses</button>
    <button class="tab" role="tab" id="tab-deadlines" data-act="tab" data-v="deadlines" aria-selected="false">Deadlines</button>
  </nav>
  <main id="view"></main>
  <p class="muted" style="font-size:12px">Your data is stored in this browser on this device only. Use Back up to save a copy as a file (lecture notes are included), and Restore to load one.</p>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="course-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off">
    <h3 id="sheet-title">Course</h3>
    <div class="grid2">
      <label class="f" for="f-code">Course code<input class="in mono" id="f-code" placeholder="AE4S01"></label>
      <label class="f" for="f-ec">EC<input class="in mono" id="f-ec" type="number" min="0" max="60" step="0.5" placeholder="Unknown"></label>
    </div>
    <label class="f" for="f-name">Name<input class="in" id="f-name" required placeholder="Course name"></label>
    <div class="grid3">
      <label class="f" for="f-status">Status
        <select class="in" id="f-status">
          <option value="considering">Considering</option><option value="planned">Planned</option>
          <option value="enrolled">Enrolled</option><option value="completed">Completed</option>
        </select></label>
      <label class="f" for="f-year">Year
        <select class="in" id="f-year"><option value="">Not set</option><option value="1">Year 1</option><option value="2">Year 2</option></select></label>
      <label class="f" for="f-quarter">Quarter
        <select class="in" id="f-quarter"><option value="">Not set</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option><option>Q1+Q2</option><option>Q2+Q3</option><option>Q3+Q4</option></select></label>
    </div>
    <label class="f" for="f-kind">Type
      <select class="in" id="f-kind"><option value="elective">Elective</option><option value="core">Core or profile</option></select></label>
    <fieldset style="border:0;padding:0;margin:0;min-width:0">
      <legend class="muted" style="font-size:12px;padding:0 0 4px">Interests it serves</legend>
      <div class="tags" id="f-tags"></div>
    </fieldset>
    <label class="f" for="f-notes">Course notes<textarea class="in" id="f-notes" rows="3" placeholder="Prerequisites, workload, exam format, who to ask"></textarea></label>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="f-delete" data-act="del-course">Delete</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="btn" data-act="close-sheet">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </span>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var TAGS = ["AI", "Maths", "Robotics", "Propulsion", "Finance"];
  var STATUSES = [["considering", "Considering"], ["planned", "Planned"], ["enrolled", "Enrolled"], ["completed", "Completed"]];
  var DEFAULTS = { totalEC: 120, electiveTarget: 22 };
  var QSLOTS = ["Y1Q1", "Y1Q2", "Y1Q3", "Y1Q4", "Y2Q1", "Y2Q2", "Y2Q3", "Y2Q4"];

  var S = {
    db: null, courses: new Map(), deadlines: new Map(), settings: Object.assign({}, DEFAULTS),
    loaded: { c: false, d: false }, tab: "courses", kind: "all", tag: null, year: null, quarter: null, editing: null, confirmDelete: false,
    lectures: new Map(), openCourse: null, lectureId: null, confirmLec: null
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ecText(n) { return n == null ? "?" : (Number.isInteger(n) ? String(n) : n.toFixed(1)); }
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function setNotice(msg) { var n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }

  /* ---------- storage ---------- */
  var KEY = "masterPlanner.v1";
  function snapshot() {
    return { v: 1, courses: courseList(), deadlines: Array.from(S.deadlines.values()), lectures: Array.from(S.lectures.values()), settings: S.settings };
  }
  var pending = null;
  function setSaved(ok) { var el = $("l-status"); if (el) el.textContent = ok ? "Saved" : "Saving…"; }
  function persistSoon() {
    clearTimeout(pending); setSaved(false);
    pending = setTimeout(function () { pending = null; persist(); setSaved(true); }, 400);
  }
  function flushPersist() { if (pending) { clearTimeout(pending); pending = null; persist(); } }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(snapshot()));
    } catch (e) {
      setNotice("This browser is blocking storage, so changes last only until you close the page. Use Back up to keep a copy.");
    }
  }
  function put(coll, id, data) {
    (coll === "courses" ? S.courses : S.deadlines).set(id, Object.assign({ id: id }, data));
    persist(); renderAll();
  }
  function remove(coll, id) {
    (coll === "courses" ? S.courses : S.deadlines).delete(id);
    persist(); renderAll();
  }
  function saveSettings() { persist(); }

  /* ---------- derived numbers ---------- */
  function committed(c) { return c.status && c.status !== "considering"; }
  function courseList() { return Array.from(S.courses.values()); }
  function sortCourses(a, b) { return String(a.code || "~").localeCompare(String(b.code || "~")) || String(a.name).localeCompare(String(b.name)); }

  function slotsOf(c) {
    if (!c.year || !c.quarter) return [];
    var qs = String(c.quarter).replace(/Q/g, "").split("+");
    return qs.map(function (q) { return "Y" + c.year + "Q" + q; });
  }

  /* ---------- rendering: summary ---------- */
  function renderSummary() {
    var all = courseList();
    var el = all.filter(function (c) { return c.kind === "elective"; });
    var target = Number(S.settings.electiveTarget) || DEFAULTS.electiveTarget;
    var total = Number(S.settings.totalEC) || DEFAULTS.totalEC;
    var sum = function (arr) { return arr.reduce(function (a, c) { return a + (typeof c.ec === "number" ? c.ec : 0); }, 0); };
    var com = sum(el.filter(committed));
    var con = sum(el.filter(function (c) { return !committed(c); }));
    var unknown = el.filter(function (c) { return typeof c.ec !== "number"; }).length;
    var allCom = sum(all.filter(committed));
    var pctCom = Math.min(100, com / target * 100);
    var pctCon = Math.min(100 - pctCom, con / target * 100);
    var left = target - com;
    var status = left > 0 ? ecText(left) + " EC still open" : (left === 0 ? "Target met" : ecText(-left) + " EC over target");

    var p1 = '<div class="panel"><h2>Electives</h2>' +
      '<div class="big mono">' + ecText(com) + '<small> / ' + ecText(target) + ' EC</small></div>' +
      '<div class="bar" role="img" aria-label="Elective EC committed ' + ecText(com) + ' of ' + ecText(target) + '"><div class="seg-commit" style="width:' + pctCom + '%"></div><div class="seg-consider" style="width:' + pctCon + '%"></div></div>' +
      '<div class="legend"><span><i class="seg-commit"></i>Planned, enrolled or completed</span><span><i class="seg-consider"></i>Still considering (' + ecText(con) + ' EC)</span></div>' +
      '<p>' + esc(status) + (unknown ? ' · <span class="muted">' + unknown + ' elective' + (unknown > 1 ? 's' : '') + ' without EC are not counted</span>' : '') + '</p>' +
      '<div class="settings"><label>Elective target <input id="set-target" class="mono" type="number" min="0" max="120" step="1" value="' + esc(target) + '"> EC</label>' +
      '<label>Programme <input id="set-total" class="mono" type="number" min="1" max="240" step="1" value="' + esc(total) + '"> EC</label>' +
      '<span class="mono">All courses committed: ' + ecText(allCom) + ' / ' + ecText(total) + '</span></div></div>';

    var rows = TAGS.map(function (t) {
      var withTag = el.filter(function (c) { return (c.tags || []).indexOf(t) >= 0; });
      var sel = withTag.filter(committed).length, cn = withTag.length - sel;
      return { t: t, sel: sel, cn: cn };
    });
    var maxN = Math.max(3, Math.max.apply(null, rows.map(function (r) { return r.sel + r.cn; })));
    var p2 = '<div class="panel"><h2>Interest coverage</h2>' + rows.map(function (r) {
      return '<div class="cov-row"><span class="cov-label"><span class="dot ' + r.t + '"></span>' + r.t + '</span><div class="cov-bar">' +
        '<div class="bar"><div class="seg-commit" style="width:' + (r.sel / maxN * 100) + '%"></div><div class="seg-consider" style="width:' + (r.cn / maxN * 100) + '%"></div></div>' +
        '<span class="cov-nums">' + r.sel + ' chosen · ' + r.cn + ' considering</span></div></div>';
    }).join("") + '</div>';

    var load = {}; QSLOTS.forEach(function (s) { load[s] = { c: 0, g: 0 }; });
    var unsched = 0;
    all.forEach(function (c) {
      if (typeof c.ec !== "number") return;
      var sl = slotsOf(c).filter(function (s) { return load[s]; });
      if (!sl.length) { unsched++; return; }
      sl.forEach(function (s) { load[s][committed(c) ? "c" : "g"] += c.ec / sl.length; });
    });
    var maxL = Math.max(15, Math.max.apply(null, QSLOTS.map(function (s) { return load[s].c + load[s].g; })));
    var p3 = '<div class="panel"><h2>Load per quarter</h2><div class="load">' + QSLOTS.map(function (s) {
      var v = load[s], hC = v.c / maxL * 84, hG = v.g / maxL * 84;
      return '<div class="load-col"><div class="load-val">' + (v.c + v.g ? ecText(Math.round((v.c + v.g) * 10) / 10) : "") + '</div>' +
        '<div class="load-stack"><div class="seg-commit" style="height:' + hC + 'px"></div><div class="seg-consider" style="height:' + hG + 'px"></div></div>' +
        '<div class="load-lab">' + s.replace("Y", "Y").replace("Q", " Q") + '</div></div>';
    }).join("") + '</div><p class="muted" style="font-size:12px">Year and quarter set on each course. Courses spanning two quarters split their EC evenly' +
      (unsched ? '; ' + unsched + ' with EC but no slot yet' : '') + '.</p></div>';

    $("summary").innerHTML = p1 + p2 + p3;
  }

  /* ---------- rendering: courses ---------- */
  function chipHTML(t) { return '<span class="chip static"><span class="dot ' + esc(t) + '"></span>' + esc(t) + '</span>'; }

  function quarterParts(c) { return String(c.quarter || "").replace(/Q/g, "").split("+").filter(Boolean); }
  function lecturesOf(courseId) { return Array.from(S.lectures.values()).filter(function (l) { return l.courseId === courseId; }); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function seg(act, cur, opts, label) {
    return '<div class="fgroup"><span class="flabel">' + label + '</span><div class="seg" role="group" aria-label="' + label + '">' +
      opts.map(function (o) { return '<button data-act="' + act + '" data-v="' + o[0] + '" aria-pressed="' + (String(cur || "") === o[0]) + '">' + o[1] + '</button>'; }).join("") + '</div></div>';
  }

  function renderCourses() {
    var v = $("view");
    if (!S.loaded.c) { v.innerHTML = '<div class="empty muted">Loading your courses…</div>'; return; }
    var all = courseList();
    if (!all.length) {
      v.innerHTML = '<div class="empty"><h3 style="font-size:24px;text-transform:uppercase">No courses yet</h3>' +
        '<p class="muted">Add the electives you are weighing and your core courses. Each one counts toward your EC, interest and quarter totals above.</p>' +
        '<button class="btn primary" data-act="add-course">Add the first course</button></div>';
      return;
    }
    var shown = all.filter(function (c) {
      if (S.kind === "elective" && c.kind !== "elective") return false;
      if (S.kind === "core" && c.kind !== "core") return false;
      if (S.tag && (c.tags || []).indexOf(S.tag) < 0) return false;
      if (S.year && String(c.year || "") !== S.year) return false;
      if (S.quarter && quarterParts(c).indexOf(S.quarter) < 0) return false;
      return true;
    }).sort(sortCourses);
    var filtering = S.kind !== "all" || S.tag || S.year || S.quarter;

    var html = '<div class="filters">' +
      seg("kind", S.kind, [["all", "All"], ["elective", "Electives"], ["core", "Core"]], "Type") +
      seg("year", S.year, [["", "All"], ["1", "Year 1"], ["2", "Year 2"]], "Year") +
      seg("quarter", S.quarter, [["", "All"], ["1", "Q1"], ["2", "Q2"], ["3", "Q3"], ["4", "Q4"]], "Quarter") +
      '<div class="tags" role="group" aria-label="Filter by interest">' + TAGS.map(function (t) {
        return '<button class="chip" data-act="tag" data-v="' + t + '" aria-pressed="' + (S.tag === t) + '"><span class="dot ' + t + '"></span>' + t + '</button>';
      }).join("") + '</div></div>' +
      '<div class="filter-meta"><span>Showing ' + shown.length + ' of ' + all.length + ' courses</span>' +
      (S.quarter ? '<span>Courses that span two quarters appear under both.</span>' : '') +
      (filtering ? '<button class="btn small" data-act="clear-filters">Clear filters</button>' : '') + '</div><div class="board">';

    STATUSES.forEach(function (st, i) {
      var inCol = shown.filter(function (c) { return (c.status || "considering") === st[0]; });
      var ec = inCol.reduce(function (a, c) { return a + (typeof c.ec === "number" ? c.ec : 0); }, 0);
      html += '<section class="col" aria-label="' + st[1] + '"><div class="col-head"><h3 style="font-size:20px;text-transform:uppercase">' + st[1] + '</h3><span class="mono">' + inCol.length + ' · ' + ecText(ec) + ' EC</span></div>';
      if (!inCol.length) html += '<p class="col-empty">Nothing here.</p>';
      inCol.forEach(function (c) {
        var when = (c.year ? "Y" + c.year + " " : "") + (c.quarter || "");
        var nLec = lecturesOf(c.id).length;
        html += '<article class="card" tabindex="0" data-act="open" data-id="' + esc(c.id) + '">' +
          '<div class="card-code"><span>' + esc(c.code || "No code") + '</span><span>' + ecText(c.ec) + ' EC' + (when.trim() ? ' · ' + esc(when.trim()) : '') + '</span></div>' +
          '<div class="card-name">' + esc(c.name) + '</div>' +
          '<div class="card-meta">' + (c.kind === "core" ? '<span class="tag-core">CORE</span>' : '') + (c.tags || []).map(chipHTML).join("") + '</div>' +
          (c.notes ? '<div class="card-note">' + esc(c.notes) + '</div>' : '') +
          (nLec ? '<div class="card-lec">' + plural(nLec, "lecture") + '</div>' : '') +
          '<div class="card-foot"><button class="btn small" data-act="move" data-dir="-1" data-id="' + esc(c.id) + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move to ' + (i ? STATUSES[i - 1][1] : '') + '">←</button>' +
          '<button class="btn small" data-act="edit" data-id="' + esc(c.id) + '">Edit</button>' +
          '<button class="btn small" data-act="move" data-dir="1" data-id="' + esc(c.id) + '"' + (i === STATUSES.length - 1 ? ' disabled' : '') + ' aria-label="Move to ' + (i < STATUSES.length - 1 ? STATUSES[i + 1][1] : '') + '">→</button></div></article>';
      });
      html += '</section>';
    });
    v.innerHTML = html + '</div>';
  }

  /* ---------- course page and lecture notes ---------- */
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtDate(s) { var d = parseDay(s); return d ? d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "No date"; }
  function sortedLectures(courseId) {
    return lecturesOf(courseId).sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")) || (b.n || 0) - (a.n || 0); });
  }
  function lecLabel(l) { return (l.title && l.title.trim()) || ("Lecture " + (l.n || "")); }
  function lectureListHTML(courseId) {
    return sortedLectures(courseId).map(function (l) {
      return '<button type="button" class="lec-item" data-act="pick-lecture" data-id="' + esc(l.id) + '" aria-current="' + (l.id === S.lectureId) + '">' +
        '<span class="lec-n">#' + esc(l.n) + ' · ' + esc(fmtDate(l.date)) + '</span><span class="lec-t">' + esc(lecLabel(l)) + '</span></button>';
    }).join("");
  }
  function renderLectureList() { var el = $("lec-list"); if (el && S.openCourse) el.innerHTML = lectureListHTML(S.openCourse); }
  function lectureEditorHTML(l) {
    return '<div class="lec-editor"><div class="lec-meta">' +
      '<label class="f" for="l-title">Title<input class="in" id="l-title" value="' + esc(l.title) + '" placeholder="Lecture ' + esc(l.n) + '"></label>' +
      '<label class="f" for="l-date">Date<input class="in mono" id="l-date" type="date" value="' + esc(l.date) + '"></label></div>' +
      '<label class="f" for="l-notes">Notes<textarea class="in notes-area" id="l-notes" placeholder="Key ideas, derivations, examples, what the lecturer stressed">\n' + esc(l.notes) + '</textarea></label>' +
      '<label class="f" for="l-follow">Questions and follow-ups<textarea class="in" id="l-follow" rows="4" placeholder="What to ask, look up or practise">\n' + esc(l.follow) + '</textarea></label>' +
      '<div class="lec-foot"><span class="mono muted" id="l-status" aria-live="polite">Saved</span>' +
      '<button type="button" class="btn danger small" data-act="del-lecture" data-id="' + esc(l.id) + '">' + (S.confirmLec === l.id ? 'Confirm delete' : 'Delete lecture') + '</button></div></div>';
  }
  function renderCoursePage(c) {
    var list = sortedLectures(c.id);
    if (!list.some(function (l) { return l.id === S.lectureId; })) S.lectureId = list.length ? list[0].id : null;
    var sel = S.lectureId ? S.lectures.get(S.lectureId) : null;
    var stName = (STATUSES.filter(function (x) { return x[0] === (c.status || "considering"); })[0] || ["", ""])[1];
    var when = (c.year ? "Y" + c.year + " " : "") + (c.quarter || "");
    $("view").innerHTML = '<div class="cp"><button class="btn small crumb" data-act="back">← All courses</button>' +
      '<header class="cp-head"><div class="cp-titles"><p class="eyebrow">' + esc(c.code || "No code") + ' · ' + ecText(c.ec) + ' EC' + (when.trim() ? ' · ' + esc(when.trim()) : '') + ' · ' + esc(stName) + '</p>' +
      '<h2 class="cp-name">' + esc(c.name) + '</h2>' +
      '<div class="card-meta">' + (c.kind === "core" ? '<span class="tag-core">CORE</span>' : '') + (c.tags || []).map(chipHTML).join("") + '</div>' +
      (c.notes ? '<p class="cp-notes">' + esc(c.notes) + '</p>' : '') + '</div>' +
      '<button class="btn" data-act="edit" data-id="' + esc(c.id) + '">Edit details</button></header>' +
      '<div class="lec-bar"><h2>Lectures · ' + list.length + '</h2><button class="btn primary" data-act="new-lecture">New lecture</button></div>' +
      (list.length
        ? '<div class="lec-layout"><div class="lec-list" id="lec-list">' + lectureListHTML(c.id) + '</div><div class="panel" id="lec-pane">' + (sel ? lectureEditorHTML(sel) : '') + '</div></div>'
        : '<div class="empty"><h3 style="font-size:24px;text-transform:uppercase">No lectures yet</h3><p class="muted">Add one after each lecture. Notes save automatically in this browser and are included in Back up.</p><button class="btn primary" data-act="new-lecture">Add the first lecture</button></div>') +
      '</div>';
  }
  function newLecture() {
    var cid = S.openCourse; if (!cid) return;
    var n = lecturesOf(cid).reduce(function (m, l) { return Math.max(m, l.n || 0); }, 0) + 1;
    var id = newId();
    S.lectures.set(id, { id: id, courseId: cid, n: n, title: "", date: today(), notes: "", follow: "", created: Date.now(), updated: Date.now() });
    S.lectureId = id; S.confirmLec = null; persist(); renderAll();
    var t = $("l-title"); if (t) t.focus();
  }
  function readRoute() {
    var m = /^#course\/(.+)$/.exec(location.hash || "");
    if (!m) return null;
    try { var id = decodeURIComponent(m[1]); return S.courses.has(id) ? id : null; } catch (e) { return null; }
  }
  function openCourse(id) {
    flushPersist(); S.openCourse = id; S.lectureId = null; S.confirmLec = null;
    var h = "#course/" + encodeURIComponent(id);
    if (location.hash !== h) { try { location.hash = h; } catch (e) {} }
    renderAll(); window.scrollTo(0, 0);
  }
  function closeCourse() {
    flushPersist(); S.openCourse = null; S.lectureId = null; S.confirmLec = null;
    if (location.hash) { try { location.hash = ""; } catch (e) {} }
    renderAll(); window.scrollTo(0, 0);
  }

  /* ---------- rendering: deadlines ---------- */
  function startOfToday() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseDay(s) { var p = String(s || "").split("-"); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function dayDiff(s) { var d = parseDay(s); return d ? Math.round((d - startOfToday()) / 86400000) : null; }
  function dueText(s) {
    var d = parseDay(s); if (!d) return "No date";
    var n = dayDiff(s);
    var rel = n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "1 day overdue" : n < 0 ? (-n) + " days overdue" : "in " + n + " days";
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + " · " + rel;
  }

  function renderDeadlines() {
    var v = $("view");
    var courses = courseList().sort(sortCourses);
    var form = '<form class="dl-form" id="dl-form" autocomplete="off">' +
      '<label class="f" for="d-title">Deadline<input class="in" id="d-title" required placeholder="Assignment 2, report, exam registration"></label>' +
      '<label class="f" for="d-course">Course<select class="in" id="d-course"><option value="">General</option>' +
      courses.map(function (c) { return '<option value="' + esc(c.code || c.name) + '">' + esc((c.code ? c.code + " " : "") + c.name) + '</option>'; }).join("") + '</select></label>' +
      '<label class="f" for="d-due">Due date<input class="in mono" id="d-due" type="date" required></label>' +
      '<button class="btn primary" type="submit">Add</button></form>';
    if (!S.loaded.d) { v.innerHTML = form + '<div class="empty muted" style="margin-top:16px">Loading deadlines…</div>'; return; }
    var all = Array.from(S.deadlines.values());
    if (!all.length) {
      v.innerHTML = form + '<div class="empty" style="margin-top:16px"><h3 style="font-size:24px;text-transform:uppercase">No deadlines yet</h3><p class="muted">Add an assignment, report or exam date. They sort by date and flag when something is overdue.</p></div>';
      return;
    }
    var open = all.filter(function (d) { return !d.done; }).sort(function (a, b) { return String(a.due).localeCompare(String(b.due)); });
    var done = all.filter(function (d) { return d.done; }).sort(function (a, b) { return String(b.due).localeCompare(String(a.due)); });
    var groups = [
      ["Overdue", open.filter(function (d) { return dayDiff(d.due) < 0; })],
      ["Next 7 days", open.filter(function (d) { var n = dayDiff(d.due); return n >= 0 && n <= 7; })],
      ["Later", open.filter(function (d) { return dayDiff(d.due) > 7; })],
      ["Done", done]
    ];
    var rowHTML = function (d) {
      var n = dayDiff(d.due), cls = d.done ? "" : (n < 0 ? "over" : n <= 3 ? "soon" : "");
      return '<div class="dl' + (d.done ? ' done' : '') + '"><input type="checkbox" data-act="toggle-dl" data-id="' + esc(d.id) + '"' + (d.done ? ' checked' : '') + ' aria-label="Mark done: ' + esc(d.title) + '">' +
        '<div><div class="dl-title">' + esc(d.title) + '</div>' + (d.course ? '<div class="dl-course">' + esc(d.course) + '</div>' : '') + '</div>' +
        '<div class="dl-due ' + cls + '">' + esc(dueText(d.due)) + '</div>' +
        '<button class="btn small" data-act="del-dl" data-id="' + esc(d.id) + '" aria-label="Delete ' + esc(d.title) + '">Remove</button></div>';
    };
    v.innerHTML = form + '<div style="display:flex;flex-direction:column;gap:18px;margin-top:18px">' + groups.filter(function (g) { return g[1].length; }).map(function (g) {
      return '<div class="dl-group"><h2>' + g[0] + ' · ' + g[1].length + '</h2>' + g[1].map(rowHTML).join("") + '</div>';
    }).join("") + '</div>';
  }

  function renderAll() {
    var oc = S.openCourse ? S.courses.get(S.openCourse) : null;
    if (S.openCourse && !oc) S.openCourse = null;
    $("summary").hidden = !!oc; $("tabs").hidden = !!oc;
    document.title = oc ? oc.name + " · Master Planner" : "Master Planner";
    if (oc) { renderCoursePage(oc); return; }
    renderSummary();
    $("tab-courses").setAttribute("aria-selected", S.tab === "courses");
    $("tab-deadlines").setAttribute("aria-selected", S.tab === "deadlines");
    var active = document.activeElement, keep = active && active.id && /^d-/.test(active.id) ? active.id : null;
    var vals = {};
    if (S.tab === "deadlines") ["d-title", "d-course", "d-due"].forEach(function (id) { var e = $(id); if (e) vals[id] = e.value; });
    if (S.tab === "courses") renderCourses(); else renderDeadlines();
    Object.keys(vals).forEach(function (id) { var e = $(id); if (e) e.value = vals[id]; });
    if (keep && $(keep)) $(keep).focus();
  }

  /* ---------- course sheet ---------- */
  function openSheet(id) {
    var c = id ? S.courses.get(id) : null;
    S.editing = id || "new"; S.confirmDelete = false;
    $("sheet-title").textContent = c ? "Edit course" : "Add course";
    $("f-code").value = c ? (c.code || "") : "";
    $("f-name").value = c ? (c.name || "") : "";
    $("f-ec").value = c && typeof c.ec === "number" ? c.ec : "";
    $("f-status").value = c ? (c.status || "considering") : "considering";
    $("f-year").value = c && c.year ? String(c.year) : "";
    $("f-quarter").value = c ? (c.quarter || "") : "";
    $("f-kind").value = c ? (c.kind || "elective") : "elective";
    $("f-notes").value = c ? (c.notes || "") : "";
    $("f-tags").innerHTML = TAGS.map(function (t) {
      var on = c && (c.tags || []).indexOf(t) >= 0;
      return '<button type="button" class="chip" data-act="sheet-tag" data-v="' + t + '" aria-pressed="' + (!!on) + '"><span class="dot ' + t + '"></span>' + t + '</button>';
    }).join("");
    var del = $("f-delete"); del.hidden = !c; del.textContent = "Delete";
    $("overlay").hidden = false;
    setTimeout(function () { $("f-name").focus(); }, 0);
  }
  function closeSheet() { $("overlay").hidden = true; S.editing = null; }

  function saveCourse(ev) {
    ev.preventDefault();
    var name = $("f-name").value.trim();
    if (!name) { $("f-name").focus(); return; }
    var ecRaw = $("f-ec").value.trim();
    var tags = Array.prototype.map.call($("f-tags").querySelectorAll('[aria-pressed="true"]'), function (b) { return b.getAttribute("data-v"); });
    var data = {
      code: $("f-code").value.trim(), name: name, ec: ecRaw === "" || isNaN(Number(ecRaw)) ? null : Number(ecRaw),
      status: $("f-status").value, year: $("f-year").value ? Number($("f-year").value) : null, quarter: $("f-quarter").value,
      kind: $("f-kind").value, tags: tags, notes: $("f-notes").value.trim()
    };
    var id = S.editing && S.editing !== "new" ? S.editing : newId();
    put("courses", id, data); closeSheet();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), v = el.getAttribute("data-v");
    if (act === "tab") { S.tab = v; renderAll(); }
    else if (act === "add-course") openSheet(null);
    else if (act === "open") { if (!e.target.closest("button")) openCourse(id); }
    else if (act === "edit") openSheet(id);
    else if (act === "back") closeCourse();
    else if (act === "new-lecture") newLecture();
    else if (act === "pick-lecture") {
      flushPersist(); S.lectureId = id; S.confirmLec = null; renderAll();
      var pane = $("lec-pane");
      if (pane && window.matchMedia && window.matchMedia("(max-width: 760px)").matches) pane.scrollIntoView({ block: "start" });
    }
    else if (act === "del-lecture") {
      if (S.confirmLec !== id) { S.confirmLec = id; el.textContent = "Confirm delete"; return; }
      S.lectures.delete(id); S.confirmLec = null; S.lectureId = null; persist(); renderAll();
    }
    else if (act === "move") {
      e.stopPropagation();
      var c = S.courses.get(id); if (!c) return;
      var idx = STATUSES.findIndex(function (s) { return s[0] === (c.status || "considering"); });
      var next = STATUSES[idx + Number(el.getAttribute("data-dir"))]; if (!next) return;
      var copy = Object.assign({}, c); delete copy.id; copy.status = next[0]; put("courses", id, copy);
    }
    else if (act === "kind") { S.kind = v; renderAll(); }
    else if (act === "year") { S.year = v || null; renderAll(); }
    else if (act === "quarter") { S.quarter = v || null; renderAll(); }
    else if (act === "clear-filters") { S.kind = "all"; S.tag = null; S.year = null; S.quarter = null; renderAll(); }
    else if (act === "tag") { S.tag = S.tag === v ? null : v; renderAll(); }
    else if (act === "sheet-tag") { el.setAttribute("aria-pressed", String(el.getAttribute("aria-pressed") !== "true")); }
    else if (act === "close-sheet") closeSheet();
    else if (act === "del-course") {
      var nl = lecturesOf(S.editing).length;
      if (!S.confirmDelete) { S.confirmDelete = true; el.textContent = nl ? "Delete course and " + plural(nl, "lecture") : "Confirm delete"; return; }
      var gone = S.editing;
      Array.from(S.lectures.values()).forEach(function (l) { if (l.courseId === gone) S.lectures.delete(l.id); });
      closeSheet();
      if (S.openCourse === gone) closeCourse();
      remove("courses", gone);
    }
    else if (act === "del-dl") remove("deadlines", id);
    else if (act === "backup") backup();
    else if (act === "restore") $("restore-file").click();
  });

    if (e.key === "Escape" && !$("overlay").hidden) closeSheet();

    } else if (t.getAttribute && t.getAttribute("data-act") === "toggle-dl") {

      var copy = Object.assign({}, d); delete copy.id; copy.done = t.checked; put("deadlines", d.id, copy);

  });

  });

  function apply(d) {
    S.courses = new Map((d.courses || []).filter(function (c) { return c && typeof c.id === "string"; }).map(function (c) { return [c.id, c]; }));
    S.deadlines = new Map((d.deadlines || []).filter(function (x) { return x && typeof x.id === "string"; }).map(function (x) { return [x.id, x]; }));
    S.settings = Object.assign({}, DEFAULTS, d.settings || {});
    if (Array.isArray(d.lectures)) {
      S.lectures = new Map(d.lectures.filter(function (l) { return l && typeof l.id === "string" && typeof l.courseId === "string"; }).map(function (l) { return [l.id, l]; }));
    }
    S.loaded.c = true; S.loaded.d = true;
  }
  function load() {
    var raw = null, data = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { setNotice("This browser is blocking storage, so changes last only until you close the page. Use Back up to keep a copy."); }
    if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
    if (data && (data.courses || data.deadlines)) { apply(data); return; }
    apply({ courses: SEED, deadlines: [], settings: DEFAULTS });
    persist();
  }

  function backup() {
    var blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    a.download = "master-planner-backup-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Backup downloaded.");
  }
  $("restore-file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        if (!d || !Array.isArray(d.courses || [])) throw new Error("bad");
        apply(d); persist(); renderAll(); toast("Backup restored.");
      } catch (err) { toast("That file is not a Master Planner backup."); }
    };
    r.readAsText(f); e.target.value = "";
  });
